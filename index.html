<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Turtwig</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #eaf6e9;
    --card: #ffffff;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #10241a; --card: #16301f; }
  }
  html, body {
    height: 100%;
    margin: 0;
  }
  body {
    background: var(--bg);
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  }
  .card {
    background: var(--card);
    border-radius: 24px;
    padding: 2rem;
    box-shadow: 0 10px 30px rgba(0,0,0,0.15);
    text-align: center;
  }
  img#turtwig {
    width: min(70vw, 420px);
    height: auto;
    cursor: pointer;
    transition: transform 0.4s ease;
    transform: rotate(var(--rotation, 0deg));
  }
  h1 {
    margin-top: 1rem;
    color: #3a6b35;
    font-size: 1.5rem;
    letter-spacing: 0.05em;
  }
  p.hint {
    margin-top: 0.25rem;
    color: #6b8f68;
    font-size: 0.85rem;
  }
</style>
</head>
<body>
  <div class="card">
    <img id="turtwig" src="turtwig.png" alt="Turtwig">
    <h1>Turtwig</h1>
    <p class="hint">click to rotate</p>
  </div>
  <script>
    const img = document.getElementById('turtwig');
    let rotation = 0;
    img.addEventListener('click', () => {
      rotation += 90;
      img.style.setProperty('--rotation', rotation + 'deg');
    });
  </script>
</body>
</html>
